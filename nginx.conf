server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 通用响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf;

    # ---- /sjcj/ 子路径托管 Vue 3 应用 ----
    # 项目用 createWebHashHistory，所有路由都以 /sjcj/index.html#/xxx 形式落地，
    # 不需要 try_files 回退到 index.html —— 路径部分永远是 index.html 自身的请求。
    location /sjcj/ {
        alias /usr/share/nginx/html/sjcj/;
        index index.html;
        autoindex off;
    }

    # 静态资源（Vite 产物带 hash）：一年强缓存
    location ~* ^/sjcj/assets/.+\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        alias /usr/share/nginx/html/sjcj/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 永远不缓存：避免部署后旧 HTML 引用已被替换的资源路径
    location = /sjcj/index.html {
        alias /usr/share/nginx/html/sjcj/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 兜底：根路径与未匹配路径直接 404，不暴露站点目录
    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}
