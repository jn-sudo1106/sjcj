name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 工程位于仓库子目录 app/。若 git 根就是 app/，把本文件移到 app/.github/ 并删除 working-directory。
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
